name: CI

# Le pipeline se lance à chaque push et à chaque pull request
on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests pytest
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      # Aucune clé API nécessaire : les tests utilisent un faux LLM
      - name: Lancer les tests
        run: pytest -v

  docker:
    name: Build et test de l'image Docker
    runs-on: ubuntu-latest
    needs: tests # ne construit l'image que si les tests passent

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build -t alternance-matcher-api .

      - name: Lancer le conteneur et vérifier /health
        run: |
          docker run -d --name api -p 8000:8000 alternance-matcher-api
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo " -> API en ligne"
              exit 0
            fi
            sleep 1
          done
          echo "L'API n'a pas démarré"
          docker logs api
          exit 1